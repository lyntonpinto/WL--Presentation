<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive PDF Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Replace "Worklyffe_Presentation_2026.pdf" with the exact name of your PDF file -->
    <iframe src="https://raw.githubusercontent.com/lyntonpinto/WL--Presentation/main/Worklyffe_Presentation_2026.pdf">
        <p>Your browser does not support iframes. 
           <a href="your-file.pdf">Click here to download the PDF.</a>
        </p>
     iframe>

body>
</html>
